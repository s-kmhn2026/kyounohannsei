<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>きょうの はっぴょう（一日の反省）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .card-shadow {
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.12), 0 4px 10px rgba(0, 0, 0, 0.08);
        }
        .card-active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
        }
        .pulse-animation {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const DEFAULT_DATA = {
            when: [
                { id: 'w1', title: '2じかんめ', speech: 'にじかんめ', emoji: '⏰', enabled: true },
                { id: 'w2', title: 'やすみじかん', speech: 'やすみじかん', emoji: '⚽', enabled: true },
                { id: 'w3', title: '3じかんめ', speech: 'さんじかんめ', emoji: '⏰', enabled: true },
                { id: 'w4', title: 'きゅうしょくのじかん', speech: 'きゅうしょくのじかん', emoji: '🍱', enabled: true },
                { id: 'w5', title: 'ひるやすみ', speech: 'ひるやすみ', emoji: '🛝', enabled: true },
                { id: 'w6', title: 'そうじのじかん', speech: 'そうじのじかん', emoji: '🧹', enabled: true },
                { id: 'w7', title: '5じかんめ', speech: 'ごじかんめ', emoji: '⏰', enabled: true },
                { id: 'w8', title: 'かえるまえのじかん', speech: 'かえるまえのじかん', emoji: '🎒', enabled: true },
                { id: 'w9', title: 'こくごのじかん', speech: 'こくごのじかん', emoji: '📖', enabled: true },
                { id: 'w10', title: 'さんすうのじかん', speech: 'さんすうのじかん', emoji: '🔢', enabled: true },
                { id: 'w11', title: 'ずこうのじかん', speech: 'ずこうのじかん', emoji: '🎨', enabled: true },
                { id: 'w12', title: 'せいたんのじかん', speech: 'せいたんのじかん', emoji: '🌱', enabled: true },
                { id: 'w13', title: 'たいいくのじかん', speech: 'たいいくのじかん', emoji: '🏃', enabled: true },
                { id: 'w14', title: 'おんがくのじかん', speech: 'おんがくのじかん', emoji: '🎵', enabled: true },
                { id: 'w15', title: 'がっかつのじかん', speech: 'がっかつのじかん', emoji: '💬', enabled: true }
            ],
            where: [
                { id: 'lh1', title: 'きょうしつ', speech: 'きょうしつで', emoji: '🏫', enabled: true },
                { id: 'lh2', title: 'たいいくかん', speech: 'たいいくかんで', emoji: '🏀', enabled: true },
                { id: 'lh3', title: 'うんどうじょう', speech: 'うんどうじょうで', emoji: '🏃', enabled: true },
                { id: 'lh4', title: 'ずこうしつ', speech: 'ずこうしつで', emoji: '🎨', enabled: true },
                { id: 'lh5', title: 'おんがくしつ', speech: 'おんがくしつで', emoji: '🎹', enabled: true },
                { id: 'lh6', title: 'ほけんしつ', speech: 'ほけんしつで', emoji: '🏥', enabled: true }
            ],
            who: [
                { id: 'wh1', title: 'せんせいと', speech: 'せんせいと', emoji: '👩‍🏫', enabled: true },
                { id: 'wh2', title: 'おともだちと', speech: 'おともだちと', emoji: '👥', enabled: true },
                { id: 'wh3', title: 'みんなで', speech: 'みんなで', emoji: '🙌', enabled: true },
                { id: 'wh4', title: 'ひとりで', speech: 'ひとりで', emoji: '👤', enabled: true }
            ],
            what: [
                { id: 'wt1', title: 'べんきょうをした', speech: 'べんきょうをしました', emoji: '✏️', enabled: true },
                { id: 'wt2', title: 'うんどうをした', speech: 'うんどうをしました', emoji: '🏃', enabled: true },
                { id: 'wt3', title: 'きゅうしょくをたべた', speech: 'きゅうしょくをたべました', emoji: '🍚', enabled: true },
                { id: 'wt4', title: 'そうじをした', speech: 'そうじをしました', emoji: '🧹', enabled: true },
                { id: 'wt5', title: 'あそんだ', speech: 'あそびました', emoji: '🛝', enabled: true },
                { id: 'wt6', title: 'さくひんをつくった', speech: 'さくひんをつくりました', emoji: '✂️', enabled: true },
                { id: 'wt7', title: 'うたをうたった', speech: 'うたをうたいました', emoji: '🎤', enabled: true }
            ],
            how: [
                { id: 'h1', title: 'たのしかった', speech: 'たのしかったです！', emoji: '😄', enabled: true },
                { id: 'h2', title: 'がんばった', speech: 'がんばりました！', emoji: '😤', enabled: true },
                { id: 'h3', title: 'むずかしかった', speech: 'むずかしかったです。', emoji: '🤔', enabled: true },
                { id: 'h4', title: 'じょうずにできた', speech: 'じょうずにできました！', emoji: '✨', enabled: true },
                { id: 'h5', title: 'うれしかった', speech: 'うれしかったです！', emoji: '🥰', enabled: true }
            ]
        };

        const STEPS = [
            { id: 'when', title: 'いつ？', speech: 'いつ', color: 'bg-rose-500', lightColor: 'bg-rose-100', borderColor: 'border-rose-400' },
            { id: 'where', title: 'どこで？', speech: 'どこで', color: 'bg-amber-500', lightColor: 'bg-amber-100', borderColor: 'border-amber-400' },
            { id: 'who', title: 'だれと？', speech: 'だれと', color: 'bg-emerald-500', lightColor: 'bg-emerald-100', borderColor: 'border-emerald-400' },
            { id: 'what', title: 'なにをした？', speech: 'なにをした', color: 'bg-sky-500', lightColor: 'bg-sky-100', borderColor: 'border-sky-400' },
            { id: 'how', title: 'どうだった？', speech: 'どうだった', color: 'bg-indigo-500', lightColor: 'bg-indigo-100', borderColor: 'border-indigo-400' },
            { id: 'summary', title: 'はっぴょう', speech: 'はっぴょう', color: 'bg-purple-600', lightColor: 'bg-purple-100', borderColor: 'border-purple-400' }
        ];

        function App() {
            const [cardsData, setCardsData] = useState(() => {
                try {
                    const saved = localStorage.getItem('tokushi_app_cards_v3');
                    return saved ? JSON.parse(saved) : DEFAULT_DATA;
                } catch (e) {
                    return DEFAULT_DATA;
                }
            });

            const [currentStep, setCurrentStep] = useState(0);
            const [selections, setSelections] = useState({
                when: null,
                where: null,
                who: null,
                what: null,
                how: null
            });

            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [settingsTab, setSettingsTab] = useState('when');
            const [isPlaying, setIsPlaying] = useState(false);
            const [isProcessing, setIsProcessing] = useState(false);
            
            // えにっき画像表示用ステート
            const [exportedImage, setExportedImage] = useState(null);
            const [isExporting, setIsExporting] = useState(false);

            // ダイアログ状態
            const [dialogState, setDialogState] = useState({ open: false, title: '', message: '', type: 'info', onConfirm: null });

            // 編集フォーム状態
            const [newItemTitle, setNewItemTitle] = useState('');
            const [newItemSpeech, setNewItemSpeech] = useState('');
            const [newItemImage, setNewItemImage] = useState(null);
            const [newItemEmoji, setNewItemEmoji] = useState('🌟');

            // データ保存
            useEffect(() => {
                try {
                    localStorage.setItem('tokushi_app_cards_v3', JSON.stringify(cardsData));
                } catch (e) {
                    showDialog('ほぞん エラー', '画像が大きすぎるため保存できませんでした。いくつかの画像を消してください。', 'alert');
                }
            }, [cardsData]);

            const speakText = (text, onEndCallback) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const uttr = new SpeechSynthesisUtterance(text);
                    uttr.lang = 'ja-JP';
                    uttr.rate = 0.85;
                    uttr.pitch = 1.0;

                    if (onEndCallback) {
                        uttr.onend = onEndCallback;
                        uttr.onerror = onEndCallback;
                    }

                    window.speechSynthesis.speak(uttr);
                } else if (onEndCallback) {
                    onEndCallback();
                }
            };

            // ステップ切り替え時にステップ名を自動発声
            const handleStepChange = (targetIdx) => {
                const nextIdx = Math.max(0, Math.min(5, targetIdx));
                setCurrentStep(nextIdx);
                if (STEPS[nextIdx]) {
                    speakText(STEPS[nextIdx].speech);
                }
            };

            const handleSelectCard = (item) => {
                const stepId = STEPS[currentStep].id;
                setSelections(prev => ({ ...prev, [stepId]: item }));
                speakText(item.title);
            };

            const handleFullSpeech = () => {
                if (isPlaying) return;
                setIsPlaying(true);

                const { when, where, who, what, how } = selections;
                const text = `きょうの、${when ? when.speech : ''}、${where ? where.speech : ''}、${who ? who.speech : ''}、${what ? what.speech : ''}。${how ? how.speech : ''}`;

                speakText(text, () => {
                    setIsPlaying(false);
                });
            };

            const showDialog = (title, message, type = 'info', onConfirm = null) => {
                setDialogState({ open: true, title, message, type, onConfirm });
            };

            const handleDeleteCard = (category, id) => {
                showDialog('かくにん', 'このカードを けしますか？', 'confirm', () => {
                    setCardsData(prev => ({
                        ...prev,
                        [category]: prev[category].filter(item => item.id !== id)
                    }));
                });
            };

            // カード表示/非表示（絞り込み）トグル
            const handleToggleCardEnabled = (category, id) => {
                setCardsData(prev => ({
                    ...prev,
                    [category]: prev[category].map(item => 
                        item.id === id ? { ...item, enabled: item.enabled === false ? true : false } : item
                    )
                }));
            };

            const handleAddCard = (e) => {
                e.preventDefault();
                if (!newItemTitle.trim() || isProcessing) return;

                const newItem = {
                    id: 'custom_' + Date.now(),
                    title: newItemTitle,
                    speech: newItemSpeech || newItemTitle,
                    image: newItemImage,
                    emoji: newItemImage ? null : (newItemEmoji || '⭐'),
                    enabled: true
                };

                setCardsData(prev => ({
                    ...prev,
                    [settingsTab]: [...prev[settingsTab], newItem]
                }));

                setNewItemTitle('');
                setNewItemSpeech('');
                setNewItemImage(null);
                setNewItemEmoji('🌟');
            };

            // 画像の圧縮リサイズ
            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsProcessing(true);
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const maxDim = 400;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxDim) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            }
                        } else {
                            if (height > maxDim) {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        setNewItemImage(compressedBase64);
                        setIsProcessing(false);
                    };
                    img.onerror = () => {
                        showDialog('エラー', '画像をよみこめませんでした。', 'alert');
                        setIsProcessing(false);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleResetData = () => {
                showDialog('かくにん', 'すべてのカードを さいしょの状態にもどしますか？', 'confirm', () => {
                    setCardsData(DEFAULT_DATA);
                    localStorage.removeItem('tokushi_app_cards_v3');
                });
            };

            const handleGenerateImage = async () => {
                setIsExporting(true);
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 1000;
                    canvas.height = 750;
                    const ctx = canvas.getContext('2d');

                    // 背景
                    ctx.fillStyle = '#fffbeb';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // 枠線
                    ctx.strokeStyle = '#fcd34d';
                    ctx.lineWidth = 12;
                    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

                    // タイトル & 日付
                    const today = new Date();
                    const dateStr = `${today.getFullYear()}ねん ${today.getMonth() + 1}がつ ${today.getDate()}にち`;

                    ctx.fillStyle = '#581c87';
                    ctx.font = 'bold 38px "Hiragino Kaku Gothic ProN", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('✨ きょうの はっぴょう ✨', canvas.width / 2, 80);

                    ctx.fillStyle = '#78350f';
                    ctx.font = 'bold 22px "Hiragino Kaku Gothic ProN", sans-serif';
                    ctx.fillText(dateStr, canvas.width / 2, 120);

                    // 5ステップカード描画
                    const cardWidth = 160;
                    const cardHeight = 220;
                    const startX = 60;
                    const gap = 20;
                    const startY = 160;

                    const loadImg = (src) => new Promise((resolve) => {
                        if (!src) return resolve(null);
                        const img = new Image();
                        img.onload = () => resolve(img);
                        img.onerror = () => resolve(null);
                        img.src = src;
                    });

                    const activeSelections = STEPS.slice(0, 5).map(step => ({
                        step,
                        item: selections[step.id]
                    }));

                    const loadedImages = await Promise.all(
                        activeSelections.map(s => s.item?.image ? loadImg(s.item.image) : Promise.resolve(null))
                    );

                    activeSelections.forEach(({ step, item }, idx) => {
                        const x = startX + idx * (cardWidth + gap);
                        const y = startY;

                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        if (ctx.roundRect) ctx.roundRect(x, y, cardWidth, cardHeight, 16);
                        else ctx.rect(x, y, cardWidth, cardHeight);
                        ctx.fill();
                        ctx.strokeStyle = '#e2e8f0';
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        ctx.fillStyle = '#64748b';
                        ctx.font = 'bold 18px "Hiragino Kaku Gothic ProN", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(step.title, x + cardWidth / 2, y + 28);

                        if (item) {
                            const img = loadedImages[idx];
                            if (img) {
                                ctx.drawImage(img, x + (cardWidth - 110) / 2, y + 36, 110, 110);
                            } else {
                                ctx.font = '50px sans-serif';
                                ctx.fillText(item.emoji || '⭐', x + cardWidth / 2, y + 105);
                            }

                            ctx.fillStyle = '#1e293b';
                            ctx.font = 'bold 20px "Hiragino Kaku Gothic ProN", sans-serif';
                            const title = item.title;
                            if (title.length > 7) {
                                ctx.fillText(title.slice(0, 7), x + cardWidth / 2, y + 172);
                                ctx.fillText(title.slice(7), x + cardWidth / 2, y + 198);
                            } else {
                                ctx.fillText(title, x + cardWidth / 2, y + 185);
                            }
                        } else {
                            ctx.fillStyle = '#cbd5e1';
                            ctx.font = '16px "Hiragino Kaku Gothic ProN", sans-serif';
                            ctx.fillText('（なし）', x + cardWidth / 2, y + 120);
                        }
                    });

                    // 文章枠
                    const boxY = 420;
                    const boxWidth = 880;
                    const boxHeight = 240;
                    const boxX = 60;

                    ctx.fillStyle = '#fff7ed';
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 24);
                    else ctx.rect(boxX, boxY, boxWidth, boxHeight);
                    ctx.fill();
                    ctx.strokeStyle = '#fde68a';
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    const { when, where, who, what, how } = selections;
                    const text1 = `「きょうの、${when ? when.speech : '＿＿'}、${where ? where.speech : '＿＿'}、`;
                    const text2 = `${who ? who.speech : '＿＿'}、${what ? what.speech : '＿＿'}。`;
                    const text3 = `${how ? how.speech : '＿＿'}」`;

                    ctx.fillStyle = '#1e293b';
                    ctx.font = 'bold 26px "Hiragino Kaku Gothic ProN", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(text1, canvas.width / 2, boxY + 70);
                    ctx.fillText(text2, canvas.width / 2, boxY + 130);
                    ctx.fillText(text3, canvas.width / 2, boxY + 190);

                    const dataUrl = canvas.toDataURL('image/png');
                    setExportedImage(dataUrl);
                } catch (err) {
                    console.error(err);
                    showDialog('エラー', '画像の作成に失敗しました。', 'alert');
                } finally {
                    setIsExporting(false);
                }
            };

            const timerRef = useRef(null);
            const handleTouchStartSettings = () => {
                timerRef.current = setTimeout(() => {
                    setIsSettingsOpen(true);
                }, 1500);
            };
            const handleTouchEndSettings = () => {
                if (timerRef.current) clearTimeout(timerRef.current);
            };

            const currentStepInfo = STEPS[currentStep];

            return (
                <div className="flex flex-col h-screen max-w-5xl mx-auto p-4 md:p-6 select-none">
                    
                    {/* ヘッダー */}
                    <header className="flex justify-between items-center mb-4 bg-white p-4 rounded-2xl shadow-sm border border-amber-200">
                        <div className="flex items-center space-x-2">
                            <span className="text-3xl">📢</span>
                            <h1 className="text-2xl font-bold text-slate-800">きょうの はっぴょう</h1>
                        </div>
                        
                        <button
                            onMouseDown={handleTouchStartSettings}
                            onMouseUp={handleTouchEndSettings}
                            onTouchStart={handleTouchStartSettings}
                            onTouchEnd={handleTouchEndSettings}
                            className="bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold px-4 py-2 rounded-xl text-xs flex flex-col items-center border border-slate-300 active:bg-slate-300"
                        >
                            <span>⚙️ せんせい用</span>
                            <span className="text-[10px] text-slate-400">（ながおし）</span>
                        </button>
                    </header>

                    {/* ステップバー（タップ時にタイトル音声再生） */}
                    <div className="grid grid-cols-6 gap-2 mb-4">
                        {STEPS.map((step, idx) => {
                            const isCurrent = idx === currentStep;
                            const isSelected = selections[step.id] || idx === 5;
                            return (
                                <button
                                    key={step.id}
                                    onClick={() => handleStepChange(idx)}
                                    className={`py-2 px-1 rounded-xl text-center transition-all ${
                                        isCurrent 
                                            ? `${step.color} text-white font-bold ring-4 ring-amber-300 shadow-md` 
                                            : isSelected 
                                                ? 'bg-white text-slate-700 border-2 border-amber-300 font-medium'
                                                : 'bg-amber-100 text-slate-400 border border-amber-200'
                                    }`}
                                >
                                    <div className="text-xs">STEP {idx + 1}</div>
                                    <div className="text-sm md:text-base truncate">{step.title}</div>
                                </button>
                            );
                        })}
                    </div>

                    {/* メインエリア */}
                    <main className="flex-1 bg-white rounded-3xl p-4 md:p-6 shadow-md border-2 border-amber-200 flex flex-col overflow-hidden">
                        
                        {currentStep < 5 ? (
                            <div className="flex-1 flex flex-col h-full">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-2xl font-bold flex items-center gap-2">
                                        <span className={`w-4 h-8 rounded-full ${currentStepInfo.color}`}></span>
                                        {currentStepInfo.title} えらんでね
                                    </h2>
                                    {selections[currentStepInfo.id] && (
                                        <div className="text-sm bg-emerald-100 text-emerald-800 font-bold px-3 py-1 rounded-full border border-emerald-300">
                                            えらんだ：{selections[currentStepInfo.id].title}
                                        </div>
                                    )}
                                </div>

                                {/* カードグリッド */}
                                <div className="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 p-2">
                                    {cardsData[currentStepInfo.id]?.filter(item => item.enabled !== false).map((item) => {
                                        const isSelected = selections[currentStepInfo.id]?.id === item.id;
                                        return (
                                            <button
                                                key={item.id}
                                                onClick={() => handleSelectCard(item)}
                                                className={`flex flex-col items-center justify-center p-3 rounded-2xl transition-all border-4 text-center cursor-pointer min-h-[155px] ${
                                                    isSelected
                                                        ? `${currentStepInfo.lightColor} ${currentStepInfo.borderColor} border-4 card-active scale-95 ring-4 ring-amber-400`
                                                        : 'bg-white border-slate-200 hover:border-amber-300 card-shadow active:scale-95'
                                                }`}
                                            >
                                                {item.image ? (
                                                    <img src={item.image} alt={item.title} className="h-20 w-20 sm:h-24 sm:w-24 object-cover rounded-xl mb-2 shadow-sm border border-slate-100" />
                                                ) : (
                                                    <span className="text-4xl sm:text-5xl mb-2">{item.emoji || '⭐'}</span>
                                                )}
                                                <span className="font-bold text-lg text-slate-800 leading-snug">{item.title}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        ) : (
                            <div className="flex-1 flex flex-col justify-between h-full overflow-y-auto">
                                {/* STEP 6: 発表画面 */}
                                <div>
                                    <div className="flex justify-between items-center mb-4 px-2">
                                        <h2 className="text-2xl font-bold text-purple-900">
                                            ✨ きょうの はっぴょう ✨
                                        </h2>
                                        <button
                                            onClick={handleGenerateImage}
                                            disabled={isExporting}
                                            className="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-2xl text-sm shadow flex items-center gap-2 transition-transform active:scale-95"
                                        >
                                            <span>📷</span>
                                            <span>{isExporting ? 'さくせい中...' : 'えにっき画像をほぞん'}</span>
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-5 gap-3 mb-6">
                                        {STEPS.slice(0, 5).map((step) => {
                                            const item = selections[step.id];
                                            return (
                                                <div 
                                                    key={step.id} 
                                                    onClick={() => {
                                                        const idx = STEPS.findIndex(s => s.id === step.id);
                                                        handleStepChange(idx);
                                                    }}
                                                    className={`p-3 rounded-2xl border-2 flex flex-col items-center text-center cursor-pointer ${
                                                        item ? `${step.lightColor} ${step.borderColor}` : 'bg-slate-50 border-dashed border-slate-300'
                                                    }`}
                                                >
                                                    <span className="text-xs text-slate-500 font-bold mb-1">{step.title}</span>
                                                    {item ? (
                                                        <>
                                                            {item.image ? (
                                                                <img src={item.image} alt={item.title} className="h-14 w-14 object-cover rounded-xl mb-1 shadow-sm border border-slate-200" />
                                                            ) : (
                                                                <span className="text-2xl mb-1">{item.emoji || '⭐'}</span>
                                                            )}
                                                            <span className="font-bold text-sm text-slate-800">{item.title}</span>
                                                        </>
                                                    ) : (
                                                        <span className="text-xs text-slate-400 my-auto py-2">（えらんでない）</span>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="bg-amber-50 p-6 rounded-2xl border-2 border-amber-200 text-xl sm:text-2xl font-bold leading-relaxed text-slate-800 text-center shadow-inner">
                                        「きょうの、
                                        <span className="text-rose-600 underline underline-offset-4 decoration-2">{selections.when?.speech || '＿＿'}</span>、
                                        <span className="text-amber-600 underline underline-offset-4 decoration-2">{selections.where?.speech || '＿＿'}</span>、
                                        <span className="text-emerald-600 underline underline-offset-4 decoration-2">{selections.who?.speech || '＿＿'}</span>、
                                        <span className="text-sky-600 underline underline-offset-4 decoration-2">{selections.what?.speech || '＿＿'}</span>。
                                        <span className="text-indigo-600 underline underline-offset-4 decoration-2">{selections.how?.speech || '＿＿'}</span>」
                                    </div>
                                </div>

                                <div className="mt-6 flex justify-center">
                                    <button
                                        onClick={handleFullSpeech}
                                        disabled={isPlaying}
                                        className={`w-full max-w-md py-5 px-8 rounded-3xl font-extrabold text-2xl text-white shadow-lg flex items-center justify-center gap-3 transition-transform active:scale-95 ${
                                            isPlaying 
                                                ? 'bg-purple-400 cursor-not-allowed pulse-animation' 
                                                : 'bg-purple-600 hover:bg-purple-700 card-shadow'
                                        }`}
                                    >
                                        <span className="text-4xl">🔊</span>
                                        <span>{isPlaying ? 'はっぴょう してい ます...' : 'おおきな こえで はっぴょう！'}</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ナビゲーションボタン */}
                        <div className="flex justify-between items-center mt-4 pt-4 border-t border-slate-100">
                            <button
                                onClick={() => handleStepChange(currentStep - 1)}
                                disabled={currentStep === 0}
                                className={`px-6 py-3 rounded-2xl font-bold text-lg ${
                                    currentStep === 0 
                                        ? 'bg-slate-100 text-slate-300 cursor-not-allowed' 
                                        : 'bg-slate-200 text-slate-700 hover:bg-slate-300 active:scale-95'
                                }`}
                            >
                                ⬅️ まえへ
                            </button>

                            {currentStep < 5 && (
                                <button
                                    onClick={() => handleStepChange(currentStep + 1)}
                                    className="px-8 py-3 rounded-2xl font-bold text-lg bg-amber-500 hover:bg-amber-600 text-white card-shadow active:scale-95 flex items-center gap-2"
                                >
                                    <span>つぎへ</span>
                                    <span>➡️</span>
                                </button>
                            )}
                        </div>
                    </main>

                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl max-w-3xl w-full max-h-[90vh] flex flex-col p-6 shadow-2xl">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                        <span>⚙️</span> カードの かんり・追加 (せんせい用)
                                    </h3>
                                    <button 
                                        onClick={() => setIsSettingsOpen(false)}
                                        className="text-slate-400 hover:text-slate-600 font-bold text-2xl px-3 py-1"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
                                    {STEPS.slice(0, 5).map(step => (
                                        <button
                                            key={step.id}
                                            onClick={() => setSettingsTab(step.id)}
                                            className={`px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap ${
                                                settingsTab === step.id 
                                                    ? `${step.color} text-white` 
                                                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                            }`}
                                        >
                                            {step.title}
                                        </button>
                                    ))}
                                </div>

                                <div className="flex-1 overflow-y-auto pr-2 space-y-6">
                                    <form onSubmit={handleAddCard} className="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                        <h4 className="font-bold text-slate-700 mb-3 text-sm">➕ あたらしいカードを追加</h4>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">ひょうじ用のもじ (例: 2じかんめ)</label>
                                                <input
                                                    type="text"
                                                    value={newItemTitle}
                                                    onChange={e => setNewItemTitle(e.target.value)}
                                                    required
                                                    className="w-full p-2 border rounded-xl text-sm"
                                                    placeholder="カードに表示する文字"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">よみあげ用の文字 (例: にじかんめ)</label>
                                                <input
                                                    type="text"
                                                    value={newItemSpeech}
                                                    onChange={e => setNewItemSpeech(e.target.value)}
                                                    className="w-full p-2 border rounded-xl text-sm"
                                                    placeholder="音声で話す文字（空欄なら表示文字と同じ）"
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">しゃしん・画像を選ぶ (iPadから)</label>
                                                <input
                                                    type="file"
                                                    accept="image/*"
                                                    onChange={handleImageChange}
                                                    className="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-100 file:text-amber-700 hover:file:bg-amber-200"
                                                />
                                            </div>
                                            {!newItemImage && (
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 mb-1">絵文字（画像がない場合）</label>
                                                    <input
                                                        type="text"
                                                        value={newItemEmoji}
                                                        onChange={e => setNewItemEmoji(e.target.value)}
                                                        className="w-full p-2 border rounded-xl text-sm"
                                                        placeholder="絵文字1つ"
                                                    />
                                                </div>
                                            )}
                                        </div>

                                        {isProcessing && (
                                            <div className="text-xs text-amber-600 font-bold mb-2">📷 画像を処理・軽量化しています...</div>
                                        )}

                                        {newItemImage && !isProcessing && (
                                            <div className="mb-3 flex items-center gap-2">
                                                <span className="text-xs text-slate-500">プレビュー:</span>
                                                <img src={newItemImage} alt="preview" className="h-12 w-12 object-cover rounded-lg border" />
                                                <button 
                                                    type="button" 
                                                    onClick={() => setNewItemImage(null)}
                                                    className="text-xs text-red-500 underline"
                                                >
                                                    画像をけす
                                                </button>
                                            </div>
                                        )}

                                        <button
                                            type="submit"
                                            disabled={isProcessing}
                                            className={`w-full py-2 text-white font-bold rounded-xl text-sm shadow ${
                                                isProcessing ? 'bg-slate-400 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700'
                                            }`}
                                        >
                                            このカードを追加する
                                        </button>
                                    </form>

                                    <div>
                                        <h4 className="font-bold text-slate-700 mb-2 text-sm">登録されているカード一覧（チェックを外すとひょうじされません）</h4>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                            {cardsData[settingsTab]?.map(item => (
                                                <div key={item.id} className="p-2 border rounded-xl flex items-center justify-between bg-white text-xs">
                                                    <div className="flex items-center gap-2 truncate pr-1">
                                                        <input
                                                            type="checkbox"
                                                            checked={item.enabled !== false}
                                                            onChange={() => handleToggleCardEnabled(settingsTab, item.id)}
                                                            className="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500 cursor-pointer"
                                                        />
                                                        {item.image ? (
                                                            <img src={item.image} alt={item.title} className="w-8 h-8 object-cover rounded" />
                                                        ) : (
                                                            <span className="text-base">{item.emoji || '⭐'}</span>
                                                        )}
                                                        <span className={`font-bold truncate ${item.enabled === false ? 'line-through text-slate-300' : 'text-slate-700'}`}>
                                                            {item.title}
                                                        </span>
                                                    </div>
                                                    <button
                                                        type="button"
                                                        onClick={() => handleDeleteCard(settingsTab, item.id)}
                                                        className="text-red-500 hover:text-red-700 p-1 font-bold"
                                                    >
                                                        🗑️
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-4 pt-3 border-t flex justify-between items-center">
                                    <button
                                        type="button"
                                        onClick={handleResetData}
                                        className="text-xs text-red-500 underline hover:text-red-700"
                                    >
                                        初期設定にもどす
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setIsSettingsOpen(false)}
                                        className="px-6 py-2 bg-slate-700 text-white font-bold rounded-xl text-sm"
                                    >
                                        閉じる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 絵日記画像プレビューモーダル */}
                    {exportedImage && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-[70]">
                            <div className="bg-white rounded-3xl max-w-2xl w-full p-5 flex flex-col items-center shadow-2xl">
                                <h3 className="text-lg font-bold text-slate-800 mb-2">📸 きょうの えにっき画像</h3>
                                <p className="text-xs text-slate-500 mb-3">画像をながおし、または下のボタンでiPadに保存できます。</p>
                                
                                <img src={exportedImage} alt="えにっき" className="w-full h-auto max-h-[60vh] object-contain rounded-2xl border shadow-md mb-4" />
                                
                                <div className="flex gap-3">
                                    <a
                                        href={exportedImage}
                                        download="kyou_no_happyou.png"
                                        className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow flex items-center gap-2"
                                    >
                                        <span>💾</span>
                                        <span>ダウンロードして保存</span>
                                    </a>
                                    <button
                                        onClick={() => setExportedImage(null)}
                                        className="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-sm"
                                    >
                                        閉じる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* カスタム確認・おしらせモーダル */}
                    {dialogState.open && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[80]">
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl border-2 border-amber-300">
                                <h3 className="text-lg font-bold mb-2 text-slate-800">{dialogState.title}</h3>
                                <p className="text-sm text-slate-600 mb-6">{dialogState.message}</p>
                                <div className="flex justify-center gap-3">
                                    {dialogState.type === 'confirm' ? (
                                        <>
                                            <button
                                                onClick={() => setDialogState({ ...dialogState, open: false })}
                                                className="px-4 py-2 bg-slate-200 text-slate-700 font-bold rounded-xl text-sm"
                                            >
                                                やめる
                                            </button>
                                            <button
                                                onClick={() => {
                                                    if (dialogState.onConfirm) dialogState.onConfirm();
                                                    setDialogState({ ...dialogState, open: false });
                                                }}
                                                className="px-4 py-2 bg-red-500 text-white font-bold rounded-xl text-sm shadow"
                                            >
                                                OK
                                            </button>
                                        </>
                                    ) : (
                                        <button
                                            onClick={() => setDialogState({ ...dialogState, open: false })}
                                            className="px-6 py-2 bg-amber-500 text-white font-bold rounded-xl text-sm shadow"
                                        >
                                            OK
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
